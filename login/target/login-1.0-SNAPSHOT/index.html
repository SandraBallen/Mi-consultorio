<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Mi Consultorio</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div class="contenedor">
        <h2>👨‍⚕️ Mi consultorio</h2>
        <hr class="header-line">

        <form id="formularioAutenticacion" action="login" method="post">
            
            <label for="correoAutenticacion">Correo electrónico</label><br>
            <input type="email" id="correoAutenticacion" name="email" required><br>

            <label for="contraseñaAutenticacion">Contraseña</label><br>
            <input type="password" id="contraseñaAutenticacion" name="password" required><br><br>

            <button type="submit">Inicio sesión</button>
        </form>

        <br>
        <h5>¿No tienes cuenta? <a href="registro.html">Regístrate aquí</a></h5>
    </div>
        
    <div class="footer">
        <p>Mi consultorio - 2026</p>
    </div>
    
    <script src="Scripts/script.js"></script>
    
</body>
</html>
