<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - Mi consultorio</title>
    <link rel="stylesheet" href="/Mi consultorio/css/style.css">
</head>
<body>
    <div class="contenedor">
        <h2> 👤 Registro de paciente</h2><hr class="header-line">
        <form id="registroFormulario">
            <label for="nombre">Nombre<span class="text-highlight">*</span></label><br>
            <input type="text" id="nombre" required><br>

            <label for="apellido">Apellido<span class="text-highlight">*</span></label><br>
            <input type="text" id="apellido" required><br>

            <label for="cedula">Cédula<span class="text-highlight">*</span></label><br>
            <input type="cedula" id="cedula" required inputmode="numeric"><br>

            <label for="correo">Correo electrónico<span class="text-highlight">*</span></label><br>
            <input type="email" id="correo" required><br>

            <label for="contraseña">Contraseña<span class="text-highlight">*</span></label><br>
            <input type="password" id="contraseña" required><br>

            <button type="boton" onclick="window.location.href= href='/index.html' ">Cancelar</button>
            <button type="boton" onclick="window.location.href= href='inicioSesion.html' ">Registrarme</button>
            <p><h6>Los campos marcados con <span class="text-highlight">*</span> son obligatorios.</h6></p>
        </form>

        <p><h5>¿Ya tienes cuenta? <a href="/paginas-html/inicioSesion.html">Inicia sesión</a></h5></p>
    </div>
    
    <div class="footer">
        <p> Mi consultorio - 2026  </p>
    </div>
</body>
</html>
